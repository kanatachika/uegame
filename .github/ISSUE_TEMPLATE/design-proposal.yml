name: 💡 玩法 / 创意提案
description: 有新的 FPS 脑洞机关、跨载体词条、动作/防具机制或开黑整活想法？直接丢在这里聊
title: "[创意] "
labels: ["design", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        不用写得多正式，也不用操心程序怎么实现。记住核心铁律（零数值成长，只靠「能力」与「次数」），把好玩的地方写清楚，大家一起打磨后合进设定集（当前草案见 `docs/design/游戏设定集_草案v2.md`）。

  - type: input
    id: summary
    attributes:
      label: 一句话说清这个点子
      description: 用最直白的话概括，比如“加一个反弹声音的假脚步喇叭机关”
      placeholder: 例如：新增防具词条「震荡波」——举盾格挡成功时反震弹开周围敌人，把贴脸对手弹进滑油里
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 这条创意属于哪一块？
      options:
        - FPS 脑洞地图机关 / 派对搞事卡
        - 动作 / 武器 / 防具与跨载体词条
        - 三环节流程、顺序与多人计分
        - 改造点经济与防滚雪球机制
        - 三层箱庭地图结构与外环入场
        - FPS 手感 / 防晕 3D / 读人视觉外显
        - 其他脑洞
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 具体怎么玩？你觉得最好玩的地方在哪？
      description: 可以描述一个你脑补出来的对局画面，或者跟现有模块配合的效果
      placeholder: |
        - 玩家怎么触发 / 使用：
        - 对局里会出现什么有意思的博弈或名场面：
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: 可能会带来什么坑或需要顺带考虑的问题？（选填）
      description: 比如会不会太强、太难懂，或者和现有规则冲突
      placeholder: 例如：如果机关触发半径太大，可能会在 FPS 视角下难以躲避，需要把前摇延长到 0.5 秒或减少单回合次数

  - type: textarea
    id: references
    attributes:
      label: 参考游戏 / 视频 / 截图（选填）
      description: 有类似手感或机制的游戏可以贴名字或链接，截图可以直接拖进框里
      placeholder: 例如：类似《Titanfall 2》的滑铲动量，或者贴一张草图
